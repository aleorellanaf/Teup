<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acortador de URL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #007bff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .contenedor {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 450px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }
    button {
      padding: 10px 20px;
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #007bff;
    }
    .resultado {
      margin-top: 20px;
      padding: 10px;
      background: 70caee;
      border: 1px solid #b2ffb2;
      border-radius: 5px;
	border-style: dashed;
      color: black;
      font-weight: bold;
    }
    .btn-borrar {
      margin-top: 15px;
      background: #ff4d4d;
    }
    .btn-borrar:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Acortador de URL</h1>
    
        <div class="input-group">
      <input type="text" placeholder="Pega tu URL larga aquí...">
      <button>Acortar</button>
    </div>

    <div class="resultado">
      enlace acortado
    </div>

   
    <button class="btn-borrar">Borrar</button>
  </div>
</body>
</html>
