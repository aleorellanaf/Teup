<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Taup</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Logo simple -->
  <h2 class="logo">🔗 Taup &darr;</h2>

  <div class="contenedor">
    
    <!-- Barra principal -->
    <div class="barra-busqueda">
      <span>🔗</span>
      <input type="text" id="urlInput" placeholder="Pega tu URL larga aquí...">
      <button onclick="acortar()">Acortar</button>
    </div>

    <!-- Caja de resultado (Oculta por defecto) -->
    <div class="resultado" id="resultadoDiv" style="display: none;">
      <p>¡URL acortada!</p>
      <div class="url-box">
        <span id="shortUrlText">taup.cl/...</span>
        <button onclick="copiarUrl()" title="Copiar">📋</button>
      </div>
      <button class="btn-ir" onclick="irUrl()">IR</button>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
