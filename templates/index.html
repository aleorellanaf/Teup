<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Taup - Acortador de URL</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <div class="contenedor">
    <h1>Acortador de URL</h1>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Pega tu URL larga aquí...">
      <button id="btnAcortar" onclick="acortar()">Acortar</button>
    </div>

    <div class="resultado" id="resultadoDiv">
      <!-- Aquí se inyectará el enlace mediante JS -->
    </div>
   
    <button class="btn-borrar" id="btnBorrar" onclick="borrar()">Borrar</button>
  </div>

  <script src="../static/app.js"></script>
</body>
</html>
